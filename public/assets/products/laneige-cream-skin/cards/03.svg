<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101F"/><stop offset=".55" stop-color="#101B32"/><stop offset="1" stop-color="#253454"/></linearGradient><radialGradient id="glow" cx="50%" cy="45%" r="62%"><stop offset="0" stop-color="#C9D8FF" stop-opacity=".28"/><stop offset=".6" stop-color="#7C9EE8" stop-opacity=".06"/><stop offset="1" stop-color="#07101F" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1440" fill="url(#bg)"/><circle cx="540" cy="650" r="520" fill="url(#glow)"/><path d="M78 120 C330 46 758 58 1012 198" fill="none" stroke="#BACBFF" stroke-width="1.5" stroke-opacity=".2"/><g font-family="'Inter','Noto Sans SC','Microsoft YaHei','PingFang SC',Arial,sans-serif"><text x="76" y="90" font-size="22" font-weight="650" fill="#AFC4FF" letter-spacing="3">03 · REFORMULATION STORY</text><text x="76" y="170" font-size="55" font-weight="720" fill="#F7FAFF"><tspan x="76">新版 Cerapeptide，</tspan><tspan x="76" dy="67">真的比旧版更好吗？</tspan></text><rect x="72" y="345" width="936" height="200" rx="34" fill="#0D1830" stroke="#92B0FF" stroke-width="1.4" opacity=".94"/><text x="112" y="414" font-size="27" font-weight="700" fill="#AFC4FF">社媒最强钩子</text><text x="112" y="476" font-size="31" font-weight="520" fill="#F0F4FF">“Cerapeptide 配方和 OG 版到底有什么不同？”</text><path d="M178 720 H902" stroke="#8EA8E8" stroke-width="3" stroke-opacity=".65"/><circle cx="270" cy="720" r="72" fill="#142241" stroke="#9DB7FF" stroke-width="2"/><circle cx="810" cy="720" r="72" fill="#142241" stroke="#9DB7FF" stroke-width="2"/><text x="270" y="710" font-size="27" font-weight="700" fill="#EEF3FF" text-anchor="middle">旧版</text><text x="270" y="748" font-size="20" fill="#AEBBD8" text-anchor="middle">OG Cream Skin</text><text x="810" y="710" font-size="27" font-weight="700" fill="#EEF3FF" text-anchor="middle">新版</text><text x="810" y="748" font-size="20" fill="#AEBBD8" text-anchor="middle">Cerapeptide</text><text x="540" y="660" font-size="22" font-weight="700" fill="#AFC4FF" text-anchor="middle">讨论焦点不是“绝对更强”</text><text x="540" y="808" font-size="29" font-weight="560" fill="#F3F6FF" text-anchor="middle">而是补水、柔润、清爽之间的平衡是否改变</text><rect x="72" y="910" width="936" height="300" rx="36" fill="#111A2E" stroke="#D7B986" stroke-width="1.2" opacity=".95"/><text x="112" y="980" font-size="25" font-weight="700" fill="#E7CFA1">当前材料能确认什么？</text><text x="112" y="1045" font-size="30" font-weight="520" fill="#F5F0E5"><tspan x="112">✓  新版完整 INCI 中有神经酰胺 NP 与四肽</tspan><tspan x="112" dy="48">✓  创作者反复比较新旧版本</tspan><tspan x="112" dy="48">✕  未检出可证明“新版一定更好”的产品临床</tspan></text><text x="76" y="1382" font-size="18" font-weight="600" fill="#7E8AA8" letter-spacing="2">REFORMULATION IS A QUESTION, NOT A CONCLUSION</text></g></svg>