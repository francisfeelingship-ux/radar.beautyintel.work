<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101F"/><stop offset=".55" stop-color="#101B32"/><stop offset="1" stop-color="#253454"/></linearGradient><radialGradient id="glow" cx="50%" cy="45%" r="62%"><stop offset="0" stop-color="#C9D8FF" stop-opacity=".28"/><stop offset=".6" stop-color="#7C9EE8" stop-opacity=".06"/><stop offset="1" stop-color="#07101F" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1440" fill="url(#bg)"/><circle cx="540" cy="650" r="520" fill="url(#glow)"/><path d="M78 120 C330 46 758 58 1012 198" fill="none" stroke="#BACBFF" stroke-width="1.5" stroke-opacity=".2"/><g font-family="'Inter','Noto Sans SC','Microsoft YaHei','PingFang SC',Arial,sans-serif"><text x="76" y="90" font-size="22" font-weight="650" fill="#AFC4FF" letter-spacing="3">04 · SOCIAL ECHO</text><text x="76" y="170" font-size="55" font-weight="720" fill="#F7FAFF"><tspan x="76">冬天的保湿水，</tspan><tspan x="76" dy="67">还是夏夜的轻乳？</tspan></text><rect x="72" y="350" width="450" height="610" rx="36" fill="#0D1830" stroke="#92B0FF" stroke-width="1.4" opacity=".94"/><text x="112" y="418" font-size="27" font-weight="700" fill="#AFC4FF">海外讨论</text><text x="112" y="500" font-size="30" font-weight="720" fill="#EFF3FF">冬季保湿刚需</text><text x="112" y="552" font-size="24" fill="#B7C2DD">与 Fenty Milky Toner 比较</text><text x="112" y="650" font-size="30" font-weight="720" fill="#EFF3FF">水乳二合一</text><text x="112" y="702" font-size="24" fill="#B7C2DD">作为 toner + moisturiser 使用</text><text x="112" y="800" font-size="30" font-weight="720" fill="#EFF3FF">购买犹豫</text><text x="112" y="852" font-size="24" fill="#B7C2DD"><tspan x="112">奶皮水太多，</tspan><tspan x="112" dy="34">是否值得买正装？</tspan></text><rect x="558" y="350" width="450" height="610" rx="36" fill="#18203A" stroke="#C2B8F2" stroke-width="1.4" opacity=".94"/><text x="598" y="418" font-size="27" font-weight="700" fill="#D1C8FF">国内有限信号</text><text x="598" y="500" font-size="30" font-weight="720" fill="#F4F1FF">夏季夜间</text><text x="598" y="552" font-size="24" fill="#C9C3DE">干皮用户评价清爽补水</text><text x="598" y="650" font-size="30" font-weight="720" fill="#F4F1FF">温和与平价</text><text x="598" y="702" font-size="24" fill="#C9C3DE">单条小红书信号，不宜泛化</text><text x="598" y="800" font-size="30" font-weight="720" fill="#F4F1FF">核心问题</text><text x="598" y="852" font-size="24" fill="#C9C3DE"><tspan x="598">痘痘肌混合皮，</tspan><tspan x="598" dy="34">会不会觉得太润？</tspan></text><rect x="72" y="1015" width="936" height="260" rx="36" fill="#111A2E" stroke="#D7B986" stroke-width="1.2" opacity=".95"/><text x="112" y="1082" font-size="25" font-weight="700" fill="#E7CFA1">怎么读这些评价？</text><text x="112" y="1148" font-size="32" font-weight="560" fill="#F5F0E5"><tspan x="112">同一支产品同时被描述为“冬季必备”和“夏夜清爽”，</tspan><tspan x="112" dy="47">说明它的真实角色高度依赖肤质、气候与后续叠加。</tspan></text><text x="76" y="1382" font-size="18" font-weight="600" fill="#7E8AA8" letter-spacing="2">YOUTUBE + REDDIT + LIMITED XIAOHONGSHU SIGNALS</text></g></svg>