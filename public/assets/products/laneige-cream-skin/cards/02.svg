<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101F"/><stop offset=".55" stop-color="#101B32"/><stop offset="1" stop-color="#253454"/></linearGradient><radialGradient id="glow" cx="50%" cy="45%" r="62%"><stop offset="0" stop-color="#C9D8FF" stop-opacity=".28"/><stop offset=".6" stop-color="#7C9EE8" stop-opacity=".06"/><stop offset="1" stop-color="#07101F" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1440" fill="url(#bg)"/><circle cx="540" cy="650" r="520" fill="url(#glow)"/><path d="M78 120 C330 46 758 58 1012 198" fill="none" stroke="#BACBFF" stroke-width="1.5" stroke-opacity=".2"/><g font-family="'Inter','Noto Sans SC','Microsoft YaHei','PingFang SC',Arial,sans-serif"><text x="76" y="90" font-size="22" font-weight="650" fill="#AFC4FF" letter-spacing="3">02 · FORMULA ARCHITECTURE</text><text x="76" y="170" font-size="56" font-weight="720" fill="#F7FAFF"><tspan x="76">它不是一瓶“有点稠的水”，</tspan><tspan x="76" dy="68">而是三层保湿结构。</tspan></text><rect x="72" y="350" width="936" height="226" rx="34" fill="#0D1830" stroke="#92B0FF" stroke-width="1.4" opacity=".94"/><text x="112" y="416" font-size="28" font-weight="700" fill="#AFC4FF">01  Cerapeptide 主线</text><text x="112" y="478" font-size="30" font-weight="520" fill="#F0F4FF"><tspan x="112">神经酰胺 NP + 乙酰基四肽-11</tspan><tspan x="112" dy="43">用于解释屏障支持与配方识别点</tspan></text><rect x="72" y="630" width="936" height="226" rx="34" fill="#0D1830" stroke="#92B0FF" stroke-width="1.4" opacity=".94"/><text x="112" y="696" font-size="28" font-weight="700" fill="#AFC4FF">02  柔润脂质层</text><text x="112" y="758" font-size="30" font-weight="520" fill="#F0F4FF"><tspan x="112">角鲨烷 + 白池花籽油</tspan><tspan x="112" dy="43">让“水”具备乳液式柔润感</tspan></text><rect x="72" y="910" width="936" height="226" rx="34" fill="#0D1830" stroke="#92B0FF" stroke-width="1.4" opacity=".94"/><text x="112" y="976" font-size="28" font-weight="700" fill="#AFC4FF">03  水相保湿网络</text><text x="112" y="1038" font-size="30" font-weight="520" fill="#F0F4FF"><tspan x="112">甘油 · 多元醇 · 透明质酸 · 银耳提取物</tspan><tspan x="112" dy="43">提供即时补水与清爽延展</tspan></text><rect x="72" y="1190" width="936" height="142" rx="30" fill="#111A2E" stroke="#E1C89B" stroke-width="1.2" opacity=".95"/><text x="112" y="1244" font-size="24" font-weight="700" fill="#E9D4A8">配方边界</text><text x="112" y="1292" font-size="28" font-weight="520" fill="#F5F0E5">能解释产品结构，不能直接替代该 SKU 的独立临床。</text><text x="76" y="1382" font-size="18" font-weight="600" fill="#7E8AA8" letter-spacing="2">FULL INCI-BASED STRUCTURE</text></g></svg>