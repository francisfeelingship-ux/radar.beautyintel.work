<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15060b"/><stop offset=".55" stop-color="#260812"/><stop offset="1" stop-color="#3b0b19"/></linearGradient><radialGradient id="g" cx="54%" cy="42%" r="60%"><stop offset="0" stop-color="#c63856" stop-opacity=".3"/><stop offset="1" stop-color="#15060b" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1440" fill="url(#bg)"/><circle cx="560" cy="620" r="500" fill="url(#g)"/><g font-family="Arial,'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="76" y="88" font-size="22" font-weight="700" fill="#e35c77" letter-spacing="3">COACH · FRAGRANCE</text><text x="76" y="170" font-size="52" font-weight="720" fill="#fff5f7"><tspan x="76">一支樱桃香，</tspan><tspan x="76" dy="66">真正要闻的是 20 分钟以后。</tspan></text><rect x="72" y="360" width="936" height="250" rx="32" fill="#2c0d17" stroke="#d34b67"/><text x="110" y="420" font-size="24" font-weight="700" fill="#ef6d87">香气轨迹</text><text x="110" y="480" font-size="28" fill="#faedf1"><tspan x="110">开场是樱桃、柑橘与粉红胡椒的明亮甜熟感，</tspan><tspan x="110" dy="42">随后花香接管，广藿香、香草和甜暖木质出现。</tspan><tspan x="110" dy="42">前调并不能代表完整留香过程。</tspan></text><rect x="72" y="650" width="936" height="250" rx="32" fill="#2c0d17" stroke="#d34b67"/><text x="110" y="710" font-size="24" font-weight="700" fill="#ef6d87">社媒比较</text><text x="110" y="770" font-size="28" fill="#faedf1"><tspan x="110">常被拿来与 Tom Ford Lost Cherry、D&amp;G Q、</tspan><tspan x="110" dy="42">Banana Republic Dark Cherry 比较。</tspan><tspan x="110" dy="42">评价集中在“不药感、不过分糖浆、也不太暗”。</tspan></text><rect x="72" y="940" width="936" height="280" rx="32" fill="#32101b" stroke="#e09aab"/><text x="110" y="1000" font-size="24" font-weight="700" fill="#f2b5c3">证据边界</text><text x="110" y="1060" font-size="28" fill="#fff0f4"><tspan x="110">报告未检出产品论文或专利，香评高度主观。</tspan><tspan x="110" dy="42">国内一条开箱实际描述 Coach Wild Rose，不能作证。</tspan><tspan x="110" dy="42">含多种香料过敏原，香氛敏感者应先试闻。</tspan></text><text x="76" y="1384" font-size="18" font-weight="600" fill="#9f7480" letter-spacing="2">SCENT TRAJECTORY · SUBJECTIVE SIGNALS</text></g></svg>