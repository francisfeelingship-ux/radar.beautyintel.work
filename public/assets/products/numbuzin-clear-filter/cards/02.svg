<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06120E"/><stop offset="0.55" stop-color="#0B1C16"/><stop offset="1" stop-color="#102820"/></linearGradient><radialGradient id="glow" cx="50%" cy="44%" r="58%"><stop offset="0" stop-color="#61E7B1" stop-opacity=".30"/><stop offset=".55" stop-color="#2AB887" stop-opacity=".08"/><stop offset="1" stop-color="#06120E" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1440" fill="url(#bg)"/><circle cx="540" cy="560" r="475" fill="url(#glow)"/><path d="M86 123 C330 38 746 62 1008 197" fill="none" stroke="#7EF3C4" stroke-width="1.5" stroke-opacity=".20"/><path d="M59 1294 C360 1370 758 1363 1021 1262" fill="none" stroke="#7EF3C4" stroke-width="1.5" stroke-opacity=".16"/><g font-family="'Inter','Noto Sans SC','Microsoft YaHei','PingFang SC',Arial,sans-serif"><text x="76" y="90" font-size="22" font-weight="650" fill="#77EFC0" letter-spacing="3">02 · FORMULA SYSTEM</text><text x="76" y="168" font-size="54" font-weight="700" fill="#F4FFF9"><tspan x="76">不是“养肤防晒”四个字，</tspan><tspan x="76" dy="65.88">而是三层配方结构。</tspan></text><rect x="74" y="365" width="932" height="220" rx="30" fill="#0B211A" stroke="#5DDDAA" stroke-width="1.2" opacity=".9"/><text x="112" y="427" font-size="30" font-weight="700" fill="#86F4C8">01  广谱防护主轴</text><text x="112" y="485" font-size="27" font-weight="480" fill="#DCEDE5"><tspan x="112">乙基己基三嗪酮 · DHHB · Tinosorb S</tspan><tspan x="112" dy="38.34">Mexoryl SX · Polysilicone-15</tspan></text><rect x="74" y="650" width="932" height="220" rx="30" fill="#0B211A" stroke="#5DDDAA" stroke-width="1.2" opacity=".9"/><text x="112" y="712" font-size="30" font-weight="700" fill="#86F4C8">02  舒缓植萃水相</text><text x="112" y="770" font-size="27" font-weight="480" fill="#DCEDE5"><tspan x="112">甘草根水 · 积雪草 · 鱼腥草</tspan><tspan x="112" dy="38.34">提供舒缓与抗氧化方向的配方线索</tspan></text><rect x="74" y="935" width="932" height="220" rx="30" fill="#0B211A" stroke="#5DDDAA" stroke-width="1.2" opacity=".9"/><text x="112" y="997" font-size="30" font-weight="700" fill="#86F4C8">03  多形态保湿网络</text><text x="112" y="1055" font-size="27" font-weight="480" fill="#DCEDE5"><tspan x="112">多种透明质酸衍生物 · 甘油 · 二醇类</tspan><tspan x="112" dy="38.34">支持水感与保湿，但不代表所有肤质都轻薄</tspan></text><rect x="74" y="1222" width="932" height="112" rx="26" fill="#173027" stroke="#D4A65A" stroke-width="1.2" opacity=".9"/><text x="112" y="1266" font-size="22" font-weight="700" fill="#F2C97B" letter-spacing="1.5">配方识别重点</text><text x="112" y="1311" font-size="27" font-weight="500" fill="#F2EEE3">烟酰胺、腺苷等是辅助护理线，不应覆盖防晒本体。</text><text x="76" y="1382" font-size="18" font-weight="600" fill="#739889" letter-spacing="2">BASED ON THE UPLOADED PRODUCT PROFILE</text></g></svg>