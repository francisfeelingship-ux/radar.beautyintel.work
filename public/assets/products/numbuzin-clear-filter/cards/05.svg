<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06120E"/><stop offset=".55" stop-color="#0B1C16"/><stop offset="1" stop-color="#102820"/></linearGradient><radialGradient id="glow" cx="50%" cy="44%" r="58%"><stop offset="0" stop-color="#61E7B1" stop-opacity=".30"/><stop offset=".55" stop-color="#2AB887" stop-opacity=".08"/><stop offset="1" stop-color="#06120E" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1440" fill="url(#bg)"/><circle cx="540" cy="560" r="475" fill="url(#glow)"/><path d="M86 123 C330 38 746 62 1008 197" fill="none" stroke="#7EF3C4" stroke-width="1.5" stroke-opacity=".20"/><path d="M59 1294 C360 1370 758 1363 1021 1262" fill="none" stroke="#7EF3C4" stroke-width="1.5" stroke-opacity=".16"/><g font-family="'Inter','Noto Sans SC','Microsoft YaHei','PingFang SC',Arial,sans-serif"><text x="76" y="90" font-size="22" font-weight="650" fill="#77EFC0" letter-spacing="3">05 · EVIDENCE BOUNDARY</text><text x="76" y="168" font-size="58" font-weight="720" fill="#F4FFF9"><tspan x="76">35 篇背景文献，</tspan><tspan x="76" dy="70.76">不等于 35 篇产品临床。</tspan></text><rect x="72" y="360" width="936" height="220" rx="36" fill="#0B211A" stroke="#5DDDAA" stroke-width="1.3" opacity=".92"/><text x="112" y="424" font-size="24" font-weight="700" fill="#82F1C3">材料能支持</text><text x="112" y="484" font-size="31" font-weight="520" fill="#EAF8F1"><tspan x="112">完整 INCI 的配方结构判断</tspan><tspan x="112" dy="46.5">社媒体验的聚合趋势与分歧</tspan></text><rect x="72" y="630" width="936" height="300" rx="36" fill="#291D16" stroke="#E3A05F" stroke-width="1.3" opacity=".92"/><text x="112" y="694" font-size="24" font-weight="700" fill="#F0B774">材料不能直接支持</text><text x="112" y="754" font-size="30" font-weight="520" fill="#F7EEE5"><tspan x="112">把背景文献当成该 SKU 的直接临床证据</tspan><tspan x="112" dy="44.4">把“舒缓”“敏感肌适用”理解为零刺激保证</tspan><tspan x="112" dy="44.4">把社媒高频好评当成所有肤质的一致结论</tspan></text><rect x="72" y="982" width="936" height="270" rx="36" fill="#0A1713" stroke="#78978A" stroke-width="1.1" opacity=".94"/><text x="112" y="1046" font-size="24" font-weight="700" fill="#BFD9CD">最终定位</text><text x="112" y="1108" font-size="34" font-weight="620" fill="#F1FAF6"><tspan x="112">一支以现代有机防晒剂为主轴，</tspan><tspan x="112" dy="49.3">叠加舒缓保湿护理线、肤感评价分化的日常防晒。</tspan></text><text x="76" y="1382" font-size="18" font-weight="600" fill="#739889" letter-spacing="2">FORMULA + SOCIAL SIGNALS, NOT A CLINICAL CLAIM</text></g></svg>