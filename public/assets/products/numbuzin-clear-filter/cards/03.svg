<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06120E"/><stop offset=".55" stop-color="#0B1C16"/><stop offset="1" stop-color="#102820"/></linearGradient><radialGradient id="glow" cx="50%" cy="44%" r="58%"><stop offset="0" stop-color="#61E7B1" stop-opacity=".30"/><stop offset=".55" stop-color="#2AB887" stop-opacity=".08"/><stop offset="1" stop-color="#06120E" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1440" fill="url(#bg)"/><circle cx="540" cy="560" r="475" fill="url(#glow)"/><path d="M86 123 C330 38 746 62 1008 197" fill="none" stroke="#7EF3C4" stroke-width="1.5" stroke-opacity=".20"/><path d="M59 1294 C360 1370 758 1363 1021 1262" fill="none" stroke="#7EF3C4" stroke-width="1.5" stroke-opacity=".16"/><g font-family="'Inter','Noto Sans SC','Microsoft YaHei','PingFang SC',Arial,sans-serif"><text x="76" y="90" font-size="22" font-weight="650" fill="#77EFC0" letter-spacing="3">03 · SOCIAL ECHO</text><text x="76" y="168" font-size="52" font-weight="700" fill="#F4FFF9"><tspan x="76">同一支防晒，</tspan><tspan x="76" dy="61.36">为什么有人说“最轻薄”，</tspan><tspan x="76" dy="61.36">有人却觉得“偏厚”？</tspan></text><rect x="72" y="420" width="450" height="600" rx="34" fill="#0B251C" stroke="#58DBA4" stroke-width="1.5" opacity=".92"/><text x="110" y="482" font-size="26" font-weight="700" fill="#7CF0C1">正向体验</text><circle cx="120" cy="558" r="10" fill="#67E8B4"/><text x="150" y="566" font-size="28" font-weight="520" fill="#EAF8F1">水感精华 / 乳液感</text><circle cx="120" cy="662" r="10" fill="#67E8B4"/><text x="150" y="670" font-size="28" font-weight="520" fill="#EAF8F1">无明显白膜</text><circle cx="120" cy="766" r="10" fill="#67E8B4"/><text x="150" y="774" font-size="28" font-weight="520" fill="#EAF8F1">成膜快，妆前较服帖</text><circle cx="120" cy="870" r="10" fill="#67E8B4"/><text x="150" y="878" font-size="28" font-weight="520" fill="#EAF8F1">日常通勤使用意愿高</text><rect x="558" y="420" width="450" height="600" rx="34" fill="#291D16" stroke="#E4A360" stroke-width="1.5" opacity=".92"/><text x="596" y="482" font-size="26" font-weight="700" fill="#F1BA78">分歧与疑问</text><circle cx="606" cy="558" r="10" fill="#E8A866"/><text x="636" y="566" font-size="28" font-weight="520" fill="#F7EEE5">足量涂抹后可能偏厚</text><circle cx="606" cy="662" r="10" fill="#E8A866"/><text x="636" y="670" font-size="28" font-weight="520" fill="#F7EEE5">搓泥？熏眼？</text><circle cx="606" cy="766" r="10" fill="#E8A866"/><text x="636" y="774" font-size="28" font-weight="520" fill="#F7EEE5">敏感脸颊短暂刺激</text><circle cx="606" cy="870" r="10" fill="#E8A866"/><text x="636" y="878" font-size="28" font-weight="520" fill="#F7EEE5">油皮与干皮反馈分裂</text><rect x="72" y="1065" width="936" height="226" rx="34" fill="#0B1814" stroke="#7C9D90" stroke-width="1.1" opacity=".93"/><text x="110" y="1124" font-size="24" font-weight="700" fill="#B8D6C9">怎么读这些评价？</text><text x="110" y="1182" font-size="31" font-weight="500" fill="#EEF7F1"><tspan x="110">“轻薄”是使用感，不是客观统一结论。</tspan><tspan x="110" dy="44.95">足量、叠加护肤、肤质与环境都会改变结果。</tspan></text><text x="76" y="1382" font-size="18" font-weight="600" fill="#739889" letter-spacing="2">AGGREGATED YOUTUBE + XIAOHONGSHU SIGNALS</text></g></svg>