<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06120E"/><stop offset=".55" stop-color="#0B1C16"/><stop offset="1" stop-color="#102820"/></linearGradient><radialGradient id="glow" cx="50%" cy="44%" r="58%"><stop offset="0" stop-color="#61E7B1" stop-opacity=".30"/><stop offset=".55" stop-color="#2AB887" stop-opacity=".08"/><stop offset="1" stop-color="#06120E" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1440" fill="url(#bg)"/><circle cx="540" cy="560" r="475" fill="url(#glow)"/><path d="M86 123 C330 38 746 62 1008 197" fill="none" stroke="#7EF3C4" stroke-width="1.5" stroke-opacity=".20"/><path d="M59 1294 C360 1370 758 1363 1021 1262" fill="none" stroke="#7EF3C4" stroke-width="1.5" stroke-opacity=".16"/><g font-family="'Inter','Noto Sans SC','Microsoft YaHei','PingFang SC',Arial,sans-serif"><text x="76" y="90" font-size="22" font-weight="650" fill="#77EFC0" letter-spacing="3">04 · FIT &amp; CAUTION</text><text x="76" y="168" font-size="54" font-weight="700" fill="#F4FFF9"><tspan x="76">更可能喜欢它的人，</tspan><tspan x="76" dy="65.88">和更应该先试用的人。</tspan></text><rect x="72" y="350" width="936" height="350" rx="36" fill="#0B251C" stroke="#58DBA4" stroke-width="1.4" opacity=".92"/><text x="112" y="418" font-size="27" font-weight="700" fill="#7CF0C1">更可能适合</text><text x="116" y="502" font-size="30" font-weight="800" fill="#6EE7B1">✓</text><text x="168" y="502" font-size="27" font-weight="500" fill="#EAF8F1">希望高倍防晒兼顾保湿与舒缓护理</text><text x="116" y="580" font-size="30" font-weight="800" fill="#6EE7B1">✓</text><text x="168" y="580" font-size="27" font-weight="500" fill="#EAF8F1">不喜欢明显白膜，重视日常通勤与妆前表现</text><text x="116" y="658" font-size="30" font-weight="800" fill="#6EE7B1">✓</text><text x="168" y="658" font-size="27" font-weight="500" fill="#EAF8F1">偏干、缺水，或环境较干燥时更关注柔润感</text><rect x="72" y="750" width="936" height="440" rx="36" fill="#2A1D16" stroke="#E3A05F" stroke-width="1.4" opacity=".92"/><text x="112" y="818" font-size="27" font-weight="700" fill="#F0B774">先做局部测试</text><text x="116" y="902" font-size="30" font-weight="800" fill="#EEA962">!</text><text x="168" y="902" font-size="27" font-weight="500" fill="#F7EEE5">眼周容易熏眼或刺痛</text><text x="116" y="976" font-size="30" font-weight="800" fill="#EEA962">!</text><text x="168" y="976" font-size="27" font-weight="500" fill="#F7EEE5">多层护肤后容易搓泥</text><text x="116" y="1050" font-size="30" font-weight="800" fill="#EEA962">!</text><text x="168" y="1050" font-size="27" font-weight="500" fill="#F7EEE5">油皮在高温高湿环境下追求极致干爽</text><text x="116" y="1124" font-size="30" font-weight="800" fill="#EEA962">!</text><text x="168" y="1124" font-size="27" font-weight="500" fill="#F7EEE5">敏感肌，或正在经历明显屏障不稳定</text><rect x="72" y="1234" width="936" height="104" rx="26" fill="#0A1914" stroke="#6B8C7E" opacity=".94"/><text x="110" y="1298" font-size="29" font-weight="560" fill="#EAF5EF">产品标签不能替代你自己的足量使用与耐受测试。</text><text x="76" y="1382" font-size="18" font-weight="600" fill="#739889" letter-spacing="2">SKIN FEEL IS CONTEXT-DEPENDENT</text></g></svg>