<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12090e"/><stop offset=".55" stop-color="#23121a"/><stop offset="1" stop-color="#341923"/></linearGradient><radialGradient id="g" cx="54%" cy="42%" r="60%"><stop offset="0" stop-color="#e9a0b8" stop-opacity=".28"/><stop offset="1" stop-color="#12090e" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1440" fill="url(#bg)"/><circle cx="560" cy="620" r="500" fill="url(#g)"/><g font-family="Arial,'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="76" y="88" font-size="22" font-weight="700" fill="#e9a0b8" letter-spacing="3">BIODANCE · GEL TONER PADS</text><text x="76" y="170" font-size="52" font-weight="720" fill="#fff7fa"><tspan x="76">“5 分钟玻璃肌”，</tspan><tspan x="76" dy="66">更像即时水合，不是胶原重建。</tspan></text><rect x="72" y="360" width="936" height="250" rx="32" fill="#25151c" stroke="#e9a0b8"/><text x="110" y="420" font-size="24" font-weight="700" fill="#f0aec2">配方结构</text><text x="110" y="480" font-size="28" fill="#faedf2"><tspan x="110">高含水凝胶载体提供冷感、贴合和短时湿敷。</tspan><tspan x="110" dy="42">胶原水、透明质酸、水解弹性蛋白承担保湿，</tspan><tspan x="110" dy="42">多肽与发酵物构成辅助护理线。</tspan></text><rect x="72" y="650" width="936" height="250" rx="32" fill="#25151c" stroke="#e9a0b8"/><text x="110" y="710" font-size="24" font-weight="700" fill="#f0aec2">社媒信号</text><text x="110" y="770" font-size="28" fill="#faedf2"><tspan x="110">高频使用场景是 T 区局部贴、迷你面膜和快速补水。</tspan><tspan x="110" dy="42">常与 Cera-nol 版本及爆款胶原面膜比较。</tspan><tspan x="110" dy="42">同时出现“胶原故事大于配方差异”的质疑。</tspan></text><rect x="72" y="940" width="936" height="280" rx="32" fill="#2c1720" stroke="#f1b6c8"/><text x="110" y="1000" font-size="24" font-weight="700" fill="#ffc8d7">证据边界</text><text x="110" y="1060" font-size="28" fill="#fff1f5"><tspan x="110">候选论文讨论特定重组胶原和胶原肽纳米胶囊，</tspan><tspan x="110" dy="42">并未确认用于该产品。</tspan><tspan x="110" dy="42">243 Dalton、10% 等数字仍需官方资料独立核验。</tspan></text><text x="76" y="1384" font-size="18" font-weight="600" fill="#9c7481" letter-spacing="2">HYDROGEL EXPERIENCE · COLLAGEN BOUNDARY</text></g></svg>