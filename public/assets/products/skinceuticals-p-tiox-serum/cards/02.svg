<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#051019"/><stop offset=".55" stop-color="#0b1b27"/><stop offset="1" stop-color="#102a3b"/></linearGradient><radialGradient id="g" cx="54%" cy="42%" r="60%"><stop offset="0" stop-color="#62a9d7" stop-opacity=".3"/><stop offset="1" stop-color="#051019" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1440" fill="url(#bg)"/><circle cx="560" cy="620" r="500" fill="url(#g)"/><g font-family="Arial,'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="76" y="88" font-size="22" font-weight="700" fill="#62a9d7" letter-spacing="3">SKINCEUTICALS · P-TIOX</text><text x="76" y="170" font-size="52" font-weight="720" fill="#f3fbff"><tspan x="76">论文指纹高度重合，</tspan><tspan x="76" dy="66">但它仍然不是“瓶中肉毒”。</tspan></text><rect x="72" y="360" width="936" height="250" rx="32" fill="#102635" stroke="#62a9d7"/><text x="110" y="420" font-size="24" font-weight="700" fill="#7dbbe1">配方指纹</text><text x="110" y="480" font-size="28" fill="#eaf6fc"><tspan x="110">乙酰基六肽-8 + 蛇毒肽样二肽 + 葡糖酸内酯，</tspan><tspan x="110" dy="42">再叠加烟酰胺与海带提取物。</tspan><tspan x="110" dy="42">这是比普通“肽精华”更清晰的组合识别。</tspan></text><rect x="72" y="650" width="936" height="250" rx="32" fill="#102635" stroke="#62a9d7"/><text x="110" y="710" font-size="24" font-weight="700" fill="#7dbbe1">研究与社媒</text><text x="110" y="770" font-size="28" fill="#eaf6fc"><tspan x="110">2026 研究测试同一核心组合并报告纹理改善；</tspan><tspan x="110" dy="42">2024 文章讨论与肉毒注射联合使用的真实案例。</tspan><tspan x="110" dy="42">社媒最强钩子却是“Botox in a bottle”。</tspan></text><rect x="72" y="940" width="936" height="280" rx="32" fill="#142d3d" stroke="#9ac8e4"/><text x="110" y="1000" font-size="24" font-weight="700" fill="#b9dbef">证据边界</text><text x="110" y="1060" font-size="28" fill="#edf8fd"><tspan x="110">可以说有高度匹配的配方研究与临床数据，</tspan><tspan x="110" dy="42">不能说外用精华等于或替代肉毒注射。</tspan><tspan x="110" dy="42">联合治疗案例也不能证明精华单独达到针剂效果。</tspan></text><text x="76" y="1384" font-size="18" font-weight="600" fill="#7296ab" letter-spacing="2">HIGH-FINGERPRINT MATCH · MEDICAL BOUNDARY</text></g></svg>