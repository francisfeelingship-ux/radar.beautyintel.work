<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120a0e"/><stop offset=".55" stop-color="#231219"/><stop offset="1" stop-color="#351722"/></linearGradient><radialGradient id="g" cx="54%" cy="42%" r="60%"><stop offset="0" stop-color="#f58da8" stop-opacity=".28"/><stop offset="1" stop-color="#120a0e" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1440" fill="url(#bg)"/><circle cx="560" cy="620" r="500" fill="url(#g)"/><g font-family="Arial,'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="76" y="88" font-size="22" font-weight="700" fill="#f58da8" letter-spacing="3">GLOW RECIPE · MOISTURISER</text><text x="76" y="170" font-size="52" font-weight="720" fill="#fff7fa"><tspan x="76">十余种肽很醒目，</tspan><tspan x="76" dy="66">但产品角色仍是一瓶面霜。</tspan></text><rect x="72" y="360" width="936" height="250" rx="32" fill="#25151c" stroke="#f58da8" stroke-opacity=".8"/><text x="110" y="420" font-size="24" font-weight="700" fill="#f58da8">配方结构</text><text x="110" y="480" font-size="28" fill="#faedf2"><tspan x="110">多肽网络负责技术识别，神经酰胺、依克多因、</tspan><tspan x="110" dy="42">β-葡聚糖、泛醇和角鲨烷共同撑起保湿屏障。</tspan><tspan x="110" dy="42">先看保湿、肤感和耐受，再谈长期抗老。</tspan></text><rect x="72" y="650" width="936" height="250" rx="32" fill="#25151c" stroke="#f58da8" stroke-opacity=".8"/><text x="110" y="710" font-size="24" font-weight="700" fill="#f58da8">当前社媒</text><text x="110" y="770" font-size="28" fill="#faedf2"><tspan x="110">YouTube 仍以首印象、试用和购买前测评为主。</tspan><tspan x="110" dy="42">夏季清爽、高颜值和西瓜概念是最强传播钩子。</tspan><tspan x="110" dy="42">长期口碑尚未形成，国内内容还存在版本混淆。</tspan></text><rect x="72" y="940" width="936" height="280" rx="32" fill="#2a171f" stroke="#f2b0c2"/><text x="110" y="1000" font-size="24" font-weight="700" fill="#ffc7d6">证据边界</text><text x="110" y="1060" font-size="28" fill="#fff0f5"><tspan x="110">25 篇文献主要讨论多肽、屏障和保湿机制，</tspan><tspan x="110" dy="42">报告未检出该具体 SKU 的直接产品论文。</tspan><tspan x="110" dy="42">较早的“西瓜面霜”体验不能直接套用到新款。</tspan></text><text x="76" y="1384" font-size="18" font-weight="600" fill="#9c7180" letter-spacing="2">NEW-LAUNCH SIGNALS · VERSION BOUNDARY</text></g></svg>