<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#140c05"/><stop offset=".55" stop-color="#251508"/><stop offset="1" stop-color="#34200d"/></linearGradient><radialGradient id="g" cx="54%" cy="42%" r="60%"><stop offset="0" stop-color="#d8a060" stop-opacity=".28"/><stop offset="1" stop-color="#140c05" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1440" fill="url(#bg)"/><circle cx="560" cy="620" r="500" fill="url(#g)"/><g font-family="Arial,'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="76" y="88" font-size="22" font-weight="700" fill="#d8a060" letter-spacing="3">NUMBUZIN NO.3 · FERMENT TONER</text><text x="76" y="170" font-size="52" font-weight="720" fill="#fff8ef"><tspan x="76">“50种发酵”是复杂度，</tspan><tspan x="76" dy="66">不是 50 倍功效。</tspan></text><rect x="72" y="360" width="936" height="250" rx="32" fill="#28180b" stroke="#d8a060"/><text x="110" y="420" font-size="24" font-weight="700" fill="#e2b177">配方结构</text><text x="110" y="480" font-size="28" fill="#f9efe3"><tspan x="110">酵母、乳酸菌、芽孢杆菌等多类发酵物</tspan><tspan x="110" dy="42">构成产品身份与精华型肤感。</tspan><tspan x="110" dy="42">烟酰胺、透明质酸、腺苷负责光泽和水合辅助。</tspan></text><rect x="72" y="650" width="936" height="250" rx="32" fill="#28180b" stroke="#d8a060"/><text x="110" y="710" font-size="24" font-weight="700" fill="#e2b177">社媒信号</text><text x="110" y="770" font-size="28" fill="#f9efe3"><tspan x="110">正向高频是精华质地、即时光泽和肤质细腻。</tspan><tspan x="110" dy="42">部分长期用户称其为 Holy Grail，</tspan><tspan x="110" dy="42">但同时存在泛红、痒疹和灼热反馈。</tspan></text><rect x="72" y="940" width="936" height="280" rx="32" fill="#301d0d" stroke="#e6c49e"/><text x="110" y="1000" font-size="24" font-weight="700" fill="#f0d1ad">证据边界</text><text x="110" y="1060" font-size="28" fill="#fff5e9"><tspan x="110">13 篇文献讨论发酵物和保湿机制，</tspan><tspan x="110" dy="42">不是这套复杂配方的直接产品临床。</tspan><tspan x="110" dy="42">刺激不能解释成“发酵在起效”，持续不适应停用。</tspan></text><text x="76" y="1384" font-size="18" font-weight="600" fill="#947d65" letter-spacing="2">FERMENT COMPLEXITY · TOLERANCE BOUNDARY</text></g></svg>