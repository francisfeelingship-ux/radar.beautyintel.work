<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#130d05"/><stop offset=".55" stop-color="#251807"/><stop offset="1" stop-color="#34230c"/></linearGradient><radialGradient id="g" cx="54%" cy="42%" r="60%"><stop offset="0" stop-color="#f1b64d" stop-opacity=".28"/><stop offset="1" stop-color="#130d05" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1440" fill="url(#bg)"/><circle cx="560" cy="620" r="500" fill="url(#g)"/><g font-family="Arial,'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="76" y="88" font-size="22" font-weight="700" fill="#f1b64d" letter-spacing="3">FRESH · LIP CREAM</text><text x="76" y="170" font-size="52" font-weight="720" fill="#fffaf0"><tspan x="76">芒果香很容易种草，</tspan><tspan x="76" dy="66">真正的分歧在质地与持久度。</tspan></text><rect x="72" y="360" width="936" height="250" rx="32" fill="#271a0b" stroke="#f1b64d"/><text x="110" y="420" font-size="24" font-weight="700" fill="#f3c56d">配方结构</text><text x="110" y="480" font-size="28" fill="#faf2df"><tspan x="110">蓖麻油、霍霍巴油、葡萄籽油和多种酯类</tspan><tspan x="110" dy="42">形成柔润与镜面光泽，聚合物维持覆盖感。</tspan><tspan x="110" dy="42">透明质酸是保湿线索，香精与色粉负责芒果识别。</tspan></text><rect x="72" y="650" width="936" height="250" rx="32" fill="#271a0b" stroke="#f1b64d"/><text x="110" y="710" font-size="24" font-weight="700" fill="#f3c56d">社媒分歧</text><text x="110" y="770" font-size="28" fill="#faf2df"><tspan x="110">正向：果香、水光、素颜友好、随手补涂。</tspan><tspan x="110" dy="42">负向：有人觉得黏厚，叠加口红会淡化底色，</tspan><tspan x="110" dy="42">吃喝后需要补涂，不属于不脱色唇釉。</tspan></text><rect x="72" y="940" width="936" height="280" rx="32" fill="#2d1d0c" stroke="#f2ce8c"/><text x="110" y="1000" font-size="24" font-weight="700" fill="#f6d9a4">证据边界</text><text x="110" y="1060" font-size="28" fill="#fff5e4"><tspan x="110">16 篇文献都是保湿、透明质酸或递送背景资料。</tspan><tspan x="110" dy="42">其他 Fresh Sugar 固体润唇膏的断裂投诉，</tspan><tspan x="110" dy="42">不能直接归因到这款 12g 软管唇霜。</tspan></text><text x="76" y="1384" font-size="18" font-weight="600" fill="#9a8761" letter-spacing="2">SENSORY SPLIT · SKU BOUNDARY</text></g></svg>