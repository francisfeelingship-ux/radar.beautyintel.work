<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06120e"/><stop offset=".58" stop-color="#0b1c16"/><stop offset="1" stop-color="#102820"/></linearGradient><radialGradient id="g" cx="52%" cy="42%" r="60%"><stop offset="0" stop-color="#d9bd72" stop-opacity=".24"/><stop offset="1" stop-color="#06120e" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1440" fill="url(#bg)"/><circle cx="560" cy="620" r="500" fill="url(#g)"/><g font-family="Arial,'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="76" y="88" font-size="22" font-weight="700" fill="#d9bd72" letter-spacing="3">ELEMIS · BODY CLEANSER</text><text x="76" y="170" font-size="52" font-weight="720" fill="#f4fff9"><tspan x="76">它的差异不是“胶原”，</tspan><tspan x="76" dy="66">而是清洁与感官系统。</tspan></text><rect x="72" y="360" width="936" height="250" rx="32" fill="#0b211a" stroke="#d9bd72" stroke-opacity=".75"/><text x="110" y="420" font-size="24" font-weight="700" fill="#d9bd72">配方结构</text><text x="110" y="480" font-size="28" fill="#e8f4ee"><tspan x="110">复合表活承担身体清洁，植物籽油负责柔润；</tspan><tspan x="110" dy="42">薄荷醇、柑橘与芳香精油强化清凉和 SPA 感。</tspan><tspan x="110" dy="42">“Pro-Collagen”更多是系列叙事，不是胶原导入证明。</tspan></text><rect x="72" y="650" width="936" height="250" rx="32" fill="#0b211a" stroke="#d9bd72" stroke-opacity=".75"/><text x="110" y="710" font-size="24" font-weight="700" fill="#d9bd72">社媒信号</text><text x="110" y="770" font-size="28" fill="#e8f4ee"><tspan x="110">高频好评：丝滑、起泡好、洗后不紧绷、居家 SPA。</tspan><tspan x="110" dy="42">主要犹豫：高价、包装完整性与联盟营销影响。</tspan><tspan x="110" dy="42">面部洁肤膏投诉不能直接外推到这款身体清洁产品。</tspan></text><rect x="72" y="940" width="936" height="270" rx="32" fill="#241d13" stroke="#e4b866"/><text x="110" y="1000" font-size="24" font-weight="700" fill="#f2c77c">证据边界</text><text x="110" y="1060" font-size="28" fill="#f6eee2"><tspan x="110">24 篇文献都属于清洁、屏障、表活或润肤背景资料。</tspan><tspan x="110" dy="42">报告未检出该具体 SKU 的直接论文、专利或临床证据。</tspan><tspan x="110" dy="42">香精、精油和薄荷醇敏感人群应先做局部试用。</tspan></text><text x="76" y="1384" font-size="18" font-weight="600" fill="#739889" letter-spacing="2">FORMULA + SOCIAL SIGNALS · SOURCE-BOUNDED</text></g></svg>