<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700" role="img" aria-labelledby="title desc">
  <title id="title">Numbuzin No.5 Vitamin Boosting Essential Toner 200ml</title>
  <desc id="desc">A centered pale-yellow rectangular toner bottle with a white cap and No.5 label on a transparent background.</desc>
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8e8e5"/>
      <stop offset="0.18" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#fbfbf8"/>
      <stop offset="1" stop-color="#dededb"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8d795" stop-opacity="0.94"/>
      <stop offset="0.12" stop-color="#f4f2bb" stop-opacity="0.94"/>
      <stop offset="0.43" stop-color="#fffed4" stop-opacity="0.98"/>
      <stop offset="0.73" stop-color="#f4ef9e" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#cbc963" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="glassGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.58"/>
      <stop offset="0.16" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.78" stop-color="#fffbd5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7f7e34" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3f3ef"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eeeeea"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="18" dy="24" stdDeviation="18" flood-color="#11130a" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="bodyClip"><rect x="214" y="176" width="272" height="430" rx="30"/></clipPath>
  </defs>

  <ellipse cx="365" cy="620" rx="174" ry="28" fill="#15170e" opacity="0.17" filter="url(#soft)"/>

  <g filter="url(#shadow)">
    <rect x="236" y="152" width="228" height="72" rx="24" fill="#e8e69b"/>
    <rect x="214" y="176" width="272" height="430" rx="30" fill="url(#bottle)" stroke="#d1cf70" stroke-width="2"/>
    <g clip-path="url(#bodyClip)">
      <rect x="214" y="176" width="272" height="430" fill="url(#glassGlow)"/>
      <rect x="227" y="182" width="34" height="410" rx="16" fill="#fff" opacity="0.28"/>
      <rect x="451" y="190" width="18" height="392" rx="9" fill="#77762f" opacity="0.12"/>
      <ellipse cx="350" cy="586" rx="120" ry="22" fill="#a6a344" opacity="0.14"/>
    </g>

    <rect x="244" y="72" width="212" height="126" rx="22" fill="url(#cap)" stroke="#e1e1de" stroke-width="2"/>
    <rect x="257" y="82" width="26" height="101" rx="13" fill="#fff" opacity="0.55"/>
    <path d="M245 176h210" stroke="#d9d9d3" stroke-width="3" opacity="0.9"/>

    <rect x="219" y="224" width="262" height="230" fill="url(#label)" opacity="0.98"/>
    <rect x="219" y="224" width="262" height="8" fill="#d8dc7e"/>
    <rect x="219" y="446" width="262" height="8" fill="#d8dc7e"/>

    <text x="239" y="264" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.6" fill="#171816">numbuz:in</text>
    <text x="239" y="293" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#c2c86a">Vitamin Boosting</text>
    <text x="239" y="315" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#93c9df">Essential Toner</text>
    <rect x="239" y="329" width="143" height="21" rx="2" fill="#a7d8e7" opacity="0.92"/>
    <text x="246" y="344" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#ffffff">BRIGHTENING ANTIOXIDANT</text>

    <text x="345" y="421" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="105" font-weight="400" fill="#11120f">5</text>
    <text x="410" y="363" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="400" fill="#11120f">+</text>
    <g opacity="0.62">
      <path d="M454 340h20M454 354h13M454 368h20M454 382h13M454 396h20M454 410h13M454 424h20" stroke="#37382f" stroke-width="2"/>
    </g>

    <rect x="480" y="248" width="31" height="104" rx="3" fill="#c4c9d5" stroke="#aeb4c1"/>
    <text x="501" y="344" transform="rotate(-90 501 344)" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="0.5" fill="#252831">Glutathione</text>

    <path d="M225 205v368c0 15 12 25 27 25" fill="none" stroke="#fff" stroke-width="3" opacity="0.32"/>
    <path d="M475 206v368c0 14-10 24-24 24" fill="none" stroke="#77762f" stroke-width="2" opacity="0.14"/>
  </g>
</svg>
