<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101105"/><stop offset=".55" stop-color="#1d1f08"/><stop offset="1" stop-color="#292b0b"/></linearGradient><radialGradient id="g" cx="54%" cy="42%" r="60%"><stop offset="0" stop-color="#d6d36a" stop-opacity=".28"/><stop offset="1" stop-color="#101105" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1440" fill="url(#bg)"/><circle cx="560" cy="620" r="500" fill="url(#g)"/><g font-family="Arial,'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="76" y="88" font-size="22" font-weight="700" fill="#d6d36a" letter-spacing="3">NUMBUZIN NO.5 · BRIGHTENING TONER</text><text x="76" y="170" font-size="52" font-weight="720" fill="#fffef2"><tspan x="76">活性堆得很完整，</tspan><tspan x="76" dy="66">耐受也必须一起评估。</tspan></text><rect x="72" y="360" width="936" height="250" rx="32" fill="#22240b" stroke="#d6d36a"/><text x="110" y="420" font-size="24" font-weight="700" fill="#e2df82">配方结构</text><text x="110" y="480" font-size="28" fill="#f8f8df"><tspan x="110">乙基维 C、维 C、熊果苷、烟酰胺与谷胱甘肽</tspan><tspan x="110" dy="42">覆盖多条提亮路径；多肽提供辅助抗老线。</tspan><tspan x="110" dy="42">神经酰胺、泛醇、红没药醇和积雪草苷缓冲耐受。</tspan></text><rect x="72" y="650" width="936" height="250" rx="32" fill="#22240b" stroke="#d6d36a"/><text x="110" y="710" font-size="24" font-weight="700" fill="#e2df82">社媒信号</text><text x="110" y="770" font-size="28" fill="#f8f8df"><tspan x="110">高频讨论是暗沉、痘印、妆前打底和同系列选择。</tspan><tspan x="110" dy="42">5号水与5号棉片并不是同一种产品角色。</tspan><tspan x="110" dy="42">大量内容含折扣码和联盟链接，归因需要谨慎。</tspan></text><rect x="72" y="940" width="936" height="280" rx="32" fill="#292b0d" stroke="#e3e1a5"/><text x="110" y="1000" font-size="24" font-weight="700" fill="#f0efb2">证据边界</text><text x="110" y="1060" font-size="28" fill="#fffdeb"><tspan x="110">12 篇文献支持维 C、烟酰胺、熊果苷等机制，</tspan><tspan x="110" dy="42">但报告未检出该具体产品的直接临床论文。</tspan><tspan x="110" dy="42">敏感、脂溢性皮炎或玫瑰痤疮状态先局部测试。</tspan></text><text x="76" y="1384" font-size="18" font-weight="600" fill="#8e9062" letter-spacing="2">MULTI-ACTIVE BRIGHTENING · TOLERANCE FIRST</text></g></svg>