<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d10"/><stop offset=".55" stop-color="#111a20"/><stop offset="1" stop-color="#1b2730"/></linearGradient><radialGradient id="g" cx="54%" cy="42%" r="60%"><stop offset="0" stop-color="#91a4b1" stop-opacity=".28"/><stop offset="1" stop-color="#080d10" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1440" fill="url(#bg)"/><circle cx="560" cy="620" r="500" fill="url(#g)"/><g font-family="Arial,'Noto Sans SC','Microsoft YaHei',sans-serif"><text x="76" y="88" font-size="22" font-weight="700" fill="#a6bac6" letter-spacing="3">PAULA'S CHOICE · 1% BHA</text><text x="76" y="170" font-size="52" font-weight="720" fill="#f5fafc"><tspan x="76">1% 不代表没有刺激，</tspan><tspan x="76" dy="66">它只是给 BHA 更低的入口。</tspan></text><rect x="72" y="360" width="936" height="250" rx="32" fill="#142029" stroke="#91a4b1"/><text x="110" y="420" font-size="24" font-weight="700" fill="#b4c7d2">配方结构</text><text x="110" y="480" font-size="28" fill="#edf4f7"><tspan x="110">1% 水杨酸负责角质与毛孔油脂调理，</tspan><tspan x="110" dy="42">凝胶车体改变延展、停留与柔润体验。</tspan><tspan x="110" dy="42">尿囊素、蘑菇、仙人掌、海藻和益生元负责缓冲。</tspan></text><rect x="72" y="650" width="936" height="250" rx="32" fill="#142029" stroke="#91a4b1"/><text x="110" y="710" font-size="24" font-weight="700" fill="#b4c7d2">社媒信号</text><text x="110" y="770" font-size="28" fill="#edf4f7"><tspan x="110">高频问题是黑头、闭口、敏感皮与长期使用价值。</tspan><tspan x="110" dy="42">知乎中出现兑水、湿敷和高频使用等个人操作，</tspan><tspan x="110" dy="42">这些不能直接当作产品说明或标准方法。</tspan></text><rect x="72" y="940" width="936" height="280" rx="32" fill="#192630" stroke="#bdcad1"/><text x="110" y="1000" font-size="24" font-weight="700" fill="#d3dce1">证据边界</text><text x="110" y="1060" font-size="28" fill="#f4f8fa"><tspan x="110">候选临床研究测试的是另一款含水杨酸凝胶，</tspan><tspan x="110" dy="42">不是该产品；车体与用法差异会改变结果。</tspan><tspan x="110" dy="42">屏障受损、已有脱皮或敏感薄皮不应追求高频。</tspan></text><text x="76" y="1384" font-size="18" font-weight="600" fill="#80919b" letter-spacing="2">LOWER-CONCENTRATION BHA · USE BOUNDARY</text></g></svg>