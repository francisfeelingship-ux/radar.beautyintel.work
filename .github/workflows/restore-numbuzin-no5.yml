name: Restore Numbuzin No.5 product

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-numbuzin-no5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore product source and exact uploaded image
        run: python .restore/restore_numbuzin.py

      - name: Build and validate
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          grep -q 'numbuzin-no5-vitamin-boosting-essential-toner' dist/data/products-batch.json
          test "$(wc -c < dist/assets/products/numbuzin-no5-vitamin-toner/product.webp)" -eq 9344
          test -f dist/assets/products/numbuzin-no5-vitamin-toner/bubble.svg

      - name: Commit repair and remove one-time files
        shell: bash
        run: |
          rm -rf .restore .github/workflows/restore-numbuzin-no5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Numbuzin No.5 product with exact uploaded image"
          git pull --rebase origin main
          git push origin HEAD:main
