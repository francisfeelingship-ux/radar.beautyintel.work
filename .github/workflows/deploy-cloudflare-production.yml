name: Deploy Cloudflare production

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".deploy-status/**"
      - "public/assets/products/numbuzin-no5-restored/product.webp"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 2a45487848120d65ccb7aa1640f8373e
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Materialize and commit the exact uploaded WebP
        id: materialize
        shell: bash
        run: |
          set -e
          node scripts/materialize-numbuzin-no5-image.mjs
          IMAGE_PATH="public/assets/products/numbuzin-no5-restored/product.webp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- "$IMAGE_PATH")" ]; then
            git add -f "$IMAGE_PATH"
            git commit -m "Materialize exact Numbuzin No.5 WebP"
            git push origin HEAD:main
            echo "committed=1" >> "$GITHUB_OUTPUT"
          else
            echo "committed=0" >> "$GITHUB_OUTPUT"
          fi
          echo "image_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and deploy when credentials are available
        id: deploy
        shell: bash
        run: |
          set +e
          METHOD="cloudflare-native-git"
          DEPLOY_EXIT=0
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            METHOD="wrangler"
            corepack enable
            pnpm install --frozen-lockfile
            DEPLOY_EXIT=$?
            if [ "$DEPLOY_EXIT" -eq 0 ]; then
              pnpm run build
              DEPLOY_EXIT=$?
            fi
            if [ "$DEPLOY_EXIT" -eq 0 ]; then
              pnpm dlx wrangler@4 deploy
              DEPLOY_EXIT=$?
            fi
          fi
          echo "method=$METHOD" >> "$GITHUB_OUTPUT"
          echo "deploy_exit=$DEPLOY_EXIT" >> "$GITHUB_OUTPUT"

      - name: Verify restored product and exact WebP on production
        id: verify
        shell: bash
        run: |
          set +e
          VERIFIED=0
          DETAIL="production did not expose a browser-ready restored product image within the verification window"
          for ATTEMPT in $(seq 1 48); do
            BUST="restore-webp-${GITHUB_RUN_ID}-${ATTEMPT}"
            INDEX_CODE=$(curl -L -sS --connect-timeout 10 --max-time 30 -o /tmp/radar-index.html -w "%{http_code}" "https://radar.beautyintel.work/?v=${BUST}")
            PRODUCT_CODE=$(curl -L -sS --connect-timeout 10 --max-time 30 -o /tmp/numbuzin-product.json -w "%{http_code}" "https://radar.beautyintel.work/data/numbuzin-no5-restored.json?v=${BUST}")
            ASSET_CODE=$(curl -L -sS --connect-timeout 10 --max-time 30 -o /tmp/numbuzin-product.webp -w "%{http_code}" "https://radar.beautyintel.work/assets/products/numbuzin-no5-restored/product.webp?v=${BUST}")
            ASSET_SIZE=$(wc -c < /tmp/numbuzin-product.webp 2>/dev/null || echo 0)
            ASSET_MAGIC=$(python -c "from pathlib import Path; data=Path('/tmp/numbuzin-product.webp').read_bytes() if Path('/tmp/numbuzin-product.webp').exists() else b''; print('RIFF-WEBP' if len(data) >= 12 and data[:4] == b'RIFF' and data[8:12] == b'WEBP' else 'invalid')")

            if [ "$INDEX_CODE" = "200" ] \
              && grep -q 'numbuzin-no5-restored.json' /tmp/radar-index.html \
              && [ "$PRODUCT_CODE" = "200" ] \
              && grep -q 'numbuzin-no5-vitamin-toner-restored' /tmp/numbuzin-product.json \
              && grep -q '/assets/products/numbuzin-no5-restored/product.webp' /tmp/numbuzin-product.json \
              && [ "$ASSET_CODE" = "200" ] \
              && [ "$ASSET_SIZE" = "9344" ] \
              && [ "$ASSET_MAGIC" = "RIFF-WEBP" ]; then
              VERIFIED=1
              DETAIL="production serves the restored product and the exact 9344-byte WebP as image/webp"
              break
            fi

            DETAIL="attempt ${ATTEMPT}: index=${INDEX_CODE} product=${PRODUCT_CODE} asset=${ASSET_CODE} bytes=${ASSET_SIZE} magic=${ASSET_MAGIC}"
            echo "$DETAIL"
            sleep 10
          done
          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          echo "detail=$DETAIL" >> "$GITHUB_OUTPUT"

      - name: Record deployment status
        if: always()
        shell: bash
        run: |
          mkdir -p .deploy-status
          if [ "${{ steps.verify.outputs.verified }}" = "1" ]; then
            STATUS="success"
          else
            STATUS="failed"
          fi
          cat > .deploy-status/cloudflare-production.txt <<EOF
          status=$STATUS
          commit=${{ steps.materialize.outputs.image_commit || github.sha }}
          method=${{ steps.deploy.outputs.method }}
          deploy_exit=${{ steps.deploy.outputs.deploy_exit }}
          detail=${{ steps.verify.outputs.detail }}
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add .deploy-status/cloudflare-production.txt
          git commit -m "Record Cloudflare production deployment status [skip ci]" || true
          git push origin HEAD:main || true

      - name: Fail when production verification fails
        if: steps.verify.outputs.verified != '1'
        run: exit 1
