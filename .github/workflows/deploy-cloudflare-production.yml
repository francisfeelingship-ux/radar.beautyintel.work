name: Deploy Cloudflare production

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".deploy-status/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 2a45487848120d65ccb7aa1640f8373e
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build and deploy when credentials are available
        id: deploy
        shell: bash
        run: |
          set +e
          METHOD="cloudflare-native-git"
          DEPLOY_EXIT=0
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            METHOD="wrangler"
            corepack enable
            pnpm install --frozen-lockfile
            DEPLOY_EXIT=$?
            if [ "$DEPLOY_EXIT" -eq 0 ]; then
              pnpm run build
              DEPLOY_EXIT=$?
            fi
            if [ "$DEPLOY_EXIT" -eq 0 ]; then
              pnpm dlx wrangler@4 deploy
              DEPLOY_EXIT=$?
            fi
          fi
          echo "method=$METHOD" >> "$GITHUB_OUTPUT"
          echo "deploy_exit=$DEPLOY_EXIT" >> "$GITHUB_OUTPUT"

      - name: Verify restored product on production
        id: verify
        shell: bash
        run: |
          set +e
          VERIFIED=0
          DETAIL=""
          for ATTEMPT in $(seq 1 30); do
            DATA_URL="https://radar.beautyintel.work/data/products-batch.json?restore=20260804-1&attempt=$ATTEMPT"
            ASSET_URL="https://radar.beautyintel.work/assets/products/numbuzin-no5-restored/bubble.svg?restore=20260804-1&attempt=$ATTEMPT"
            curl -fsS "$DATA_URL" -o /tmp/products-batch.json
            DATA_EXIT=$?
            ASSET_CODE=$(curl -sS -o /tmp/numbuzin-bubble.svg -w "%{http_code}" "$ASSET_URL")
            if [ "$DATA_EXIT" -eq 0 ] \
              && grep -q 'numbuzin-no5-vitamin-toner-restored' /tmp/products-batch.json \
              && [ "$ASSET_CODE" = "200" ] \
              && grep -q 'data:image/webp;base64,UklGRngkAABXRUJQ' /tmp/numbuzin-bubble.svg; then
              VERIFIED=1
              DETAIL="restored product data and exact uploaded image are live"
              break
            fi
            DETAIL="attempt $ATTEMPT: data_exit=$DATA_EXIT asset_code=$ASSET_CODE"
            sleep 10
          done
          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          echo "detail=$DETAIL" >> "$GITHUB_OUTPUT"

      - name: Record deployment status
        if: always()
        shell: bash
        run: |
          mkdir -p .deploy-status
          if [ "${{ steps.verify.outputs.verified }}" = "1" ]; then
            STATUS="success"
          else
            STATUS="failed"
          fi
          cat > .deploy-status/cloudflare-production.txt <<EOF
          status=$STATUS
          commit=$GITHUB_SHA
          method=${{ steps.deploy.outputs.method }}
          deploy_exit=${{ steps.deploy.outputs.deploy_exit }}
          detail=${{ steps.verify.outputs.detail }}
          checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add .deploy-status/cloudflare-production.txt
          git commit -m "Record Cloudflare production deployment status [skip ci]" || true
          git push origin HEAD:main || true

      - name: Fail when production verification fails
        if: steps.verify.outputs.verified != '1'
        run: exit 1
